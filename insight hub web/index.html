<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SetAll | Insights Hub (Beta)</title>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { deep: '#020617', slate: '#0F172A', teal: '#14B8A6', purple: '#8B5CF6', orange: '#F97316' } } } }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #020617; color: #F8FAFC; }
        .wiggle { animation: wiggle 0.5s ease-in-out infinite; }
        @keyframes wiggle { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(1deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        const CATEGORY_COLORS = ["#14B8A6", "#8B5CF6", "#F59E0B", "#EF4444", "#3B82F6", "#EC4899"];
        const INITIAL_DATA = [
            { date: '2024-03-01', category: 'Groceries', amount: 120, type: 'expense' },
            { date: '2024-03-05', category: 'Salary', amount: 3500, type: 'income' },
            { date: '2024-03-10', category: 'Rent', amount: 1200, type: 'expense' },
            { date: '2024-03-15', category: 'Travel', amount: 450, type: 'expense' },
            { date: '2024-03-25', category: 'Utilities', amount: 150, type: 'expense' },
        ];

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { lucide.createIcons(); });
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const DonutChart = ({ data, total }) => {
            let currentOffset = 0;
            return (
                <div className="relative w-48 h-48 mx-auto flex items-center justify-center">
                    <svg viewBox="0 0 100 100" className="w-full h-full transform -rotate-90">
                        <circle cx="50" cy="50" r="15.9" fill="transparent" stroke="#1E293B" strokeWidth="6" />
                        {data.map((d, i) => {
                            const pct = (d.value / (total || 1)) * 100;
                            const offset = currentOffset;
                            currentOffset += pct;
                            return <circle key={i} cx="50" cy="50" r="15.9" fill="transparent" stroke={CATEGORY_COLORS[i % CATEGORY_COLORS.length]} strokeWidth="6" strokeDasharray={`${pct} 100`} strokeDashoffset={-offset} className="transition-all duration-1000" />
                        })}
                    </svg>
                    <div className="absolute inset-0 flex flex-col items-center justify-center">
                        <span className="text-[10px] text-slate-500 uppercase font-bold">Total</span>
                        <span className="text-xl font-bold">${total.toLocaleString()}</span>
                    </div>
                </div>
            );
        };

        const TrendBarChart = ({ data }) => {
            const max = Math.max(...data.map(d => Math.max(d.income, d.expense)), 1) * 1.1;
            return (
                <div className="flex items-end justify-between h-full w-full gap-2 pt-4">
                    {data.map((d, i) => (
                        <div key={i} className="flex flex-col justify-end items-center flex-1 h-full group relative">
                            <div className="flex items-end gap-1 w-full h-full justify-center">
                                <div style={{ height: `${(d.income/max)*100}%` }} className="w-full max-w-[12px] bg-brand-teal rounded-t-sm opacity-80" />
                                <div style={{ height: `${(d.expense/max)*100}%` }} className="w-full max-w-[12px] bg-brand-purple rounded-t-sm opacity-80" />
                            </div>
                            <span className="text-[10px] text-slate-500 mt-2">{d.day}</span>
                        </div>
                    ))}
                </div>
            );
        };

        function App() {
            const [data] = useState(INITIAL_DATA);
            const [isEditMode, setIsEditMode] = useState(false);
            const [widgets, setWidgets] = useState([
                { id: 'w1', type: 'stat', title: 'Net Worth', metric: 'net' },
                { id: 'w2', type: 'stat', title: 'Daily Burn', metric: 'burn' },
                { id: 'w3', type: 'trend', title: 'Cash Flow Analysis' },
                { id: 'w4', type: 'donut', title: 'Spending Categories' },
            ]);
            const [messages, setMessages] = useState([{ role: 'ai', text: "Hello! I'm the SetAll AI. Ask me to analyze your data or build new widgets." }]);
            const [input, setInput] = useState("");
            const [isThinking, setIsThinking] = useState(false);
            const chatEndRef = useRef(null);

            const stats = useMemo(() => {
                const inc = data.filter(d => d.type === 'income').reduce((s, d) => s + d.amount, 0);
                const exp = data.filter(d => d.type === 'expense').reduce((s, d) => s + d.amount, 0);
                const catMap = data.reduce((acc, curr) => {
                    if (curr.type === 'expense') acc[curr.category] = (acc[curr.category] || 0) + curr.amount;
                    return acc;
                }, {});
                const trendMap = data.reduce((acc, curr) => {
                    const day = curr.date.split('-')[2];
                    if (!acc[day]) acc[day] = { day, income: 0, expense: 0 };
                    acc[day][curr.type] += curr.amount;
                    return acc;
                }, {});
                return { inc, exp, net: inc - exp, burn: (exp / 30).toFixed(2), cats: Object.entries(catMap).map(([name, value]) => ({ name, value })).sort((a,b) => b.value - a.value), trend: Object.values(trendMap).sort((a,b) => a.day - b.day) };
            }, [data]);

            const removeWidget = (id) => setWidgets(widgets.filter(w => w.id !== id));

            const sendMsg = (e) => {
                e.preventDefault();
                if (!input.trim()) return;
                setMessages(p => [...p, { role: 'user', text: input }]);
                setInput("");
                setIsThinking(true);
                
                // Simulate AI response for testing
                setTimeout(() => {
                    setMessages(p => [...p, { role: 'ai', text: "I've analyzed your request. Based on your spending, housing is your largest expense. I've added a new visualizer for you!" }]);
                    setIsThinking(false);
                }, 1500);
            };

            const renderWidget = (w) => {
                if (w.type === 'stat') return (
                    <div className="flex flex-col justify-center h-full">
                        <Icon name={w.metric === 'burn' ? 'flame' : 'activity'} className={w.metric === 'expense' || w.metric === 'burn' ? 'text-brand-purple' : 'text-brand-teal'} size={24} />
                        <p className="text-3xl font-bold mt-4">${stats[w.metric]}</p>
                    </div>
                );
                if (w.type === 'donut') return <DonutChart data={stats.cats} total={stats.exp} />;
                if (w.type === 'trend') return <div className="h-[200px]"><TrendBarChart data={stats.trend} /></div>;
            };

            return (
                <div className="flex flex-col md:flex-row h-screen overflow-hidden">
                    <div className="flex-1 overflow-y-auto p-8 relative">
                        <header className="flex justify-between items-center mb-8">
                            <div className="flex items-center gap-3">
                                <div className="bg-brand-teal p-2.5 rounded-2xl"><Icon name="layout-dashboard" className="text-brand-deep" size={24} /></div>
                                <div><h1 className="text-2xl font-extrabold">Insights <span className="text-brand-teal">Canvas</span></h1></div>
                            </div>
                            <button onClick={() => setIsEditMode(!isEditMode)} className={`px-4 py-2 font-bold rounded-xl flex items-center gap-2 ${isEditMode ? 'bg-brand-orange text-white' : 'bg-slate-800 text-slate-300'}`}>
                                <Icon name="settings-2" size={16}/> {isEditMode ? "Done Editing" : "Edit Layout"}
                            </button>
                        </header>
                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                            {widgets.map(w => (
                                <div key={w.id} className={`bg-[#0F172A] border border-slate-800 rounded-3xl p-6 relative ${isEditMode ? 'wiggle ring-2 ring-brand-orange/50' : ''} ${w.type === 'trend' ? 'md:col-span-2' : ''}`}>
                                    {isEditMode && <button onClick={() => removeWidget(w.id)} className="absolute -top-3 -right-3 p-2 bg-red-500 rounded-full z-10"><Icon name="x" size={14}/></button>}
                                    <h3 className="text-slate-400 text-sm font-bold uppercase tracking-wider mb-4">{w.title}</h3>
                                    {renderWidget(w)}
                                </div>
                            ))}
                        </div>
                    </div>
                    
                    {/* AI Sidebar */}
                    <div className="w-full md:w-96 bg-[#0F172A] border-l border-slate-800 flex flex-col h-full shrink-0">
                        <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                            <div className="p-2 bg-brand-purple/10 rounded-xl"><Icon name="sparkles" className="text-brand-purple" /></div>
                            <h2 className="font-bold">AI Co-Pilot</h2>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-4">
                            {messages.map((m, i) => (
                                <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`p-4 rounded-2xl text-sm max-w-[85%] ${m.role === 'user' ? 'bg-brand-teal text-brand-deep font-medium rounded-tr-sm' : 'bg-slate-800 text-slate-200 rounded-tl-sm'}`}>
                                        {m.text}
                                    </div>
                                </div>
                            ))}
                            {isThinking && <div className="text-slate-500 text-sm animate-pulse ml-2">AI is thinking...</div>}
                            <div ref={chatEndRef} />
                        </div>
                        <div className="p-4 bg-[#020617]/50 border-t border-slate-800">
                            <form onSubmit={sendMsg} className="relative">
                                <input type="text" value={input} onChange={e => setInput(e.target.value)} placeholder="Ask to build a widget..." className="w-full bg-[#0F172A] border border-slate-700 rounded-2xl py-3 pl-4 pr-12 text-sm focus:outline-none focus:border-brand-purple text-white"/>
                                <button type="submit" className="absolute right-2 top-1/2 -translate-y-1/2 p-2 bg-brand-purple rounded-xl hover:bg-purple-400"><Icon name="send" size={16}/></button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
