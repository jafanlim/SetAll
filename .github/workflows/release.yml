name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: SetAll-macOS.dmg
            asset_path: SetAll-macOS.dmg
          - os: windows-latest
            artifact_name: SetAll-Windows.exe
            asset_path: build/windows/installer/SetAll-Windows.exe

    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      # macOS Build & Package
      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release
          brew install create-dmg
          create-dmg \
            --volname "SetAll Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 120 \
            "SetAll-macOS.dmg" \
            "build/macos/Build/Products/Release/setall.app"

      # Windows Build & Package
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release
          iscc windows/installer.iss

      # Upload the packaged artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: SetAll-macOS.dmg

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: SetAll-Windows.exe

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SetAll-macOS.dmg
            SetAll-Windows.exe