name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Enable desktop targets
        run: flutter config --enable-macos-desktop --enable-windows-desktop

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: flutter build macos --release

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: flutter build windows --release

      - name: Zip macOS artifact
        if: matrix.os == 'macos-latest'
        run: zip -r SetAll-macOS.zip build/macos/Build/Products/Release/setall.app

      - name: Zip Windows artifact
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path build\windows\x64\runner\Release -DestinationPath SetAll-Windows.zip
        shell: pwsh

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: SetAll-macOS
          path: SetAll-macOS.zip

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: SetAll-Windows
          path: SetAll-Windows.zip

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: SetAll-macOS

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SetAll-Windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SetAll-macOS.zip
            SetAll-Windows.zip
