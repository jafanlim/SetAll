name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: SetAll-macOS.dmg
            asset_path: SetAll-macOS.dmg
          - os: windows-latest
            artifact_name: SetAll-Windows.exe
            asset_path: build/windows/installer/SetAll-Windows.exe

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Restore Firebase config files
        shell: bash
        run: |
          echo "${{ secrets.FIREBASE_OPTIONS_DART_B64 }}" | base64 --decode > lib/firebase_options.dart

      - name: Restore macOS Firebase plist
        if: matrix.os == 'macos-latest'
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}" | base64 --decode > macos/Runner/GoogleService-Info.plist

      - name: Restore Windows google-services.json
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 --decode > android/app/google-services.json

      - name: Install Dependencies
        run: flutter pub get

      # ── macOS Build & Package ──────────────────────────────────────────────
      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release --no-tree-shake-icons

      - name: Import Developer ID certificate
        if: matrix.os == 'macos-latest' && env.CERT_P12_B64 != ''
        env:
          CERT_P12_B64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
        run: |
          # Create a temporary keychain and import the Developer ID Application cert
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign, notarize & package macOS DMG
        if: matrix.os == 'macos-latest' && env.CERT_P12_B64 != ''
        env:
          CERT_P12_B64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_B64 }}
          APPLE_ID:       ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID:  ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP=build/macos/Build/Products/Release/SetAll.app

          # Deep-sign with hardened runtime (required for notarization)
          codesign --force --deep --options runtime \
            --sign "Developer ID Application" \
            "$APP"

          # Verify signature
          codesign --verify --deep --strict "$APP"

          # Create DMG from the signed .app
          brew install create-dmg
          create-dmg \
            --volname "SetAll Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "SetAll.app" 150 185 \
            --hide-extension "SetAll.app" \
            --app-drop-link 450 185 \
            "SetAll-macOS.dmg" \
            "$APP" \
            || true
          test -f SetAll-macOS.dmg

          # Notarize the DMG
          xcrun notarytool submit SetAll-macOS.dmg \
            --apple-id      "$APPLE_ID" \
            --team-id       "$APPLE_TEAM_ID" \
            --password      "$APPLE_APP_PASSWORD" \
            --wait

          # Staple the notarization ticket
          xcrun stapler staple SetAll-macOS.dmg

      - name: Package macOS DMG (unsigned)
        if: matrix.os == 'macos-latest' && env.CERT_P12_B64 == ''
        env:
          CERT_P12_B64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_B64 }}
        run: |
          APP=build/macos/Build/Products/Release/SetAll.app
          brew install create-dmg
          create-dmg \
            --volname "SetAll Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "SetAll.app" 150 185 \
            --hide-extension "SetAll.app" \
            --app-drop-link 450 185 \
            "SetAll-macOS.dmg" \
            "$APP" \
            || true
          test -f SetAll-macOS.dmg

      # ── Windows Build & Package ────────────────────────────────────────────
      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup --yes --no-progress

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Package Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Patch AppVersion in installer.iss from the git tag (strip leading 'v')
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          (Get-Content windows/installer.iss) -replace 'AppVersion=.*', "AppVersion=$tag" |
            Set-Content windows/installer.iss
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── Upload artifact ────────────────────────────────────────────────────
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: SetAll-macOS.dmg
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SetAll-Windows.exe
          path: dist

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          overwrite: true
          files: |
            dist/SetAll-macOS.dmg
            dist/SetAll-Windows.exe
