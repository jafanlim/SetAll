name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: SetAll-macOS.dmg
            asset_path: SetAll-macOS.dmg
          - os: windows-latest
            artifact_name: SetAll-Windows.exe
            asset_path: build/windows/installer/SetAll-Windows.exe

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      # ── macOS Build & Package ──────────────────────────────────────────────
      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release

      - name: Sign & package macOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          codesign --force --deep --sign - \
            "build/macos/Build/Products/Release/setall.app"
          brew install create-dmg
          create-dmg \
            --volname "SetAll Installer" \
            --no-internet-enable \
            "SetAll-macOS.dmg" \
            "build/macos/Build/Products/Release/setall.app" \
            || true
          # create-dmg exits 1 if no background/window set but still produces the DMG
          test -f SetAll-macOS.dmg

      # ── Windows Build & Package ────────────────────────────────────────────
      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup --yes

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Package Windows installer
        if: matrix.os == 'windows-latest'
        run: iscc windows/installer.iss
        shell: cmd

      # ── Upload artifact ────────────────────────────────────────────────────
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: SetAll-macOS.dmg
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SetAll-Windows.exe
          path: dist

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SetAll-macOS.dmg
            dist/SetAll-Windows.exe
