name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: SetAll-macOS.dmg
            asset_path: SetAll-macOS.dmg
          - os: windows-latest
            artifact_name: SetAll-Windows.exe
            asset_path: build/windows/installer/SetAll-Windows.exe

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      # ── macOS Build & Package ──────────────────────────────────────────────
      - name: Disable macOS code signing in Xcode project
        if: matrix.os == 'macos-latest'
        run: |
          # Remove team ID and set ad-hoc signing so Xcode never looks for a certificate
          sed -i '' \
            -e 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' \
            -e 's/CODE_SIGN_IDENTITY = [^;]*;/CODE_SIGN_IDENTITY = "-";/g' \
            -e 's/CODE_SIGNING_REQUIRED = [^;]*;/CODE_SIGNING_REQUIRED = NO;/g' \
            -e 's/CODE_SIGNING_ALLOWED = [^;]*;/CODE_SIGNING_ALLOWED = NO;/g' \
            macos/Runner.xcodeproj/project.pbxproj

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release

      - name: Sign & package macOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          codesign --force --deep --sign - \
            "build/macos/Build/Products/Release/setall.app"
          brew install create-dmg
          create-dmg \
            --volname "SetAll Installer" \
            "SetAll-macOS.dmg" \
            "build/macos/Build/Products/Release/setall.app" \
            || true
          test -f SetAll-macOS.dmg

      # ── Windows Build & Package ────────────────────────────────────────────
      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup --yes --no-progress

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Package Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── Upload artifact ────────────────────────────────────────────────────
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: SetAll-macOS.dmg
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SetAll-Windows.exe
          path: dist

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          overwrite: true
          files: |
            dist/SetAll-macOS.dmg
            dist/SetAll-Windows.exe
