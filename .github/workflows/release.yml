name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: SetAll-macOS.dmg
            asset_path: SetAll-macOS.dmg
          - os: windows-latest
            artifact_name: SetAll-Windows.exe
            asset_path: build/windows/installer/SetAll-Windows.exe

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Restore Firebase config files
        shell: bash
        run: |
          echo "${{ secrets.FIREBASE_OPTIONS_DART_B64 }}" | base64 --decode > lib/firebase_options.dart

      - name: Restore macOS Firebase plist
        if: matrix.os == 'macos-latest'
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}" | base64 --decode > macos/Runner/GoogleService-Info.plist

      - name: Restore Windows google-services.json
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 --decode > android/app/google-services.json

      - name: Install Dependencies
        run: flutter pub get

      # speech_to_text_windows 1.0.0+beta.8 exports SpeechToTextWindowsPluginRegisterWithRegistrar
      # but flutter pub get regenerates the registrant with the old symbol name. Patch it.
      - name: Patch Windows speech_to_text symbol
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $f = "windows/flutter/generated_plugin_registrant.cc"
          (Get-Content $f) -replace 'SpeechToTextWindowsRegisterWithRegistrar\b', 'SpeechToTextWindowsPluginRegisterWithRegistrar' |
            Set-Content $f
          Write-Host "Patched speech_to_text symbol in $f"

      # ── macOS Build & Package ──────────────────────────────────────────────
      - name: Build macOS
        if: matrix.os == 'macos-latest'
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release --no-tree-shake-icons

      - name: Ad-hoc sign & package macOS DMG
        if: matrix.os == 'macos-latest'
        run: |
          find build/macos/Build/Products/Release/SetAll.app \
            -type f -name "*" \
            -exec codesign --force --deep --sign - {} +
          brew install create-dmg
          create-dmg \
            --volname "SetAll Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "SetAll.app" 150 185 \
            --hide-extension "SetAll.app" \
            --app-drop-link 450 185 \
            --background "/System/Library/Desktop Pictures/Solid Colors/Stone.png" \
            "SetAll-macOS.dmg" \
            "build/macos/Build/Products/Release/SetAll.app" \
            || true
          test -f SetAll-macOS.dmg

      # ── Windows Build & Package ────────────────────────────────────────────
      - name: Install Inno Setup
        if: matrix.os == 'windows-latest'
        run: choco install innosetup --yes --no-progress

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Package Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Patch AppVersion in installer.iss from the git tag (strip leading 'v')
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          (Get-Content windows/installer.iss) -replace 'AppVersion=.*', "AppVersion=$tag" |
            Set-Content windows/installer.iss
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── Upload artifact ────────────────────────────────────────────────────
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: SetAll-macOS.dmg
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SetAll-Windows.exe
          path: dist

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          overwrite: true
          files: |
            dist/SetAll-macOS.dmg
            dist/SetAll-Windows.exe
