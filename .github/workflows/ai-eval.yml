name: AI Eval (promptfoo)

on:
  push:
    paths:
      - "netlify/functions/ai-analyst.js"
      - "netlify/functions/ingest.js"
      - "supabase/functions/ai-analyst/**"
      - "promptfoo/**"
  pull_request:
    paths:
      - "netlify/functions/ai-analyst.js"
      - "netlify/functions/ingest.js"
      - "supabase/functions/ai-analyst/**"
      - "promptfoo/**"

jobs:
  eval:
    name: promptfoo eval — ai-analyst chat
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        # Use `npm install`, not `npm ci`: the committed lockfile is generated by a
        # sandboxed local npm whose transitive-dep resolution differs from CI's npm
        # (e.g. gcp-metadata 8.1.2 vs 7.0.1), so `npm ci`'s strict lock<->package.json
        # sync check hard-fails. `npm install` reconciles the drift instead.
        run: npm install --no-audit --no-fund

      - name: Run promptfoo eval — ai-analyst chat
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npx promptfoo eval --config promptfoo/promptfooconfig.yaml --no-cache
        # Non-zero exit code from promptfoo blocks merge (any failing assertion = exit 1)

      - name: Run promptfoo eval — bank-statement classifier (ingest.js)
        # Runs even if the chat eval failed, so both results surface in one run.
        if: ${{ !cancelled() }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npx promptfoo eval --config promptfoo/ingest_classify_config.yaml --no-cache
