<!DOCTYPE html>
<html>
<head>
  <!--
    This IS the Flutter web entry point (loads flutter_bootstrap.js) so that
    `flutter run -d chrome` launches the app in dev. Do NOT put marketing HTML
    here. The PUBLIC landing page lives in "new website/landing page.html";
    `make build-web` copies it over build/web/index.html AFTER the Flutter build
    and serves this Flutter app at /app via web/app.html (see Makefile). So this
    file's content is not what ships at https://setall.app/.
    The pdf.js scripts below are required by the pdfx plugin
    (regenerate with `flutter pub run pdfx:install_web`).
  -->
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SetAll — Premium Multi-Currency Expense Sharing">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
  <title>SetAll</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; background: #0F172A; min-height: 100vh; }
  </style>
</head>
<body>
  <script src='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs' type='module'></script>
  <script type='module'>
  var { pdfjsLib } = globalThis;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';

  var pdfRenderOptions = {
    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
    cMapPacked: true,
  }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
