<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SetAll — Premium Multi-Currency Expense Sharing">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
  <title>SetAll</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; background: #0F172A; min-height: 100vh; }
  </style>
</head>
<body>
  <!-- pdf.js: loaded non-blocking; guarded so a CDN miss never hangs the app -->
  <script>
    (function () {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs';
      s.type = 'module';
      s.onload = function () {
        try {
          var lib = globalThis['pdfjsLib'] || (globalThis['pdfjs-dist'] && globalThis['pdfjs-dist'].getDocument ? globalThis['pdfjs-dist'] : null);
          if (lib) {
            lib.GlobalWorkerOptions.workerSrc =
              'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.mjs';
            window.pdfRenderOptions = {
              cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/cmaps/',
              cMapPacked: true,
            };
          }
        } catch (e) { /* pdf.js optional — Flutter PDF viewer degrades gracefully */ }
      };
      s.onerror = function () { /* CDN unreachable — Flutter PDF viewer degrades gracefully */ };
      document.head.appendChild(s);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
