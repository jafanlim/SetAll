[build]
  publish = "build/web"

[functions]
  node_bundler = "esbuild"

[functions."ai-analyst"]
  timeout = 26

[functions."voice-entry"]
  timeout = 20

[build.environment]
  NODE_VERSION = "18"

# Security headers on everything
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "upgrade-insecure-requests;"
    Cache-Control = "public, max-age=31536000, immutable"

# HTML files must revalidate so new deploys are picked up immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# JS files — explicit MIME type + no long-term CDN cache
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Flutter bootstrap — never cache, always fresh
[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Service worker must never be cached — browsers must always fetch fresh
[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# manifest.json and version files must revalidate
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
